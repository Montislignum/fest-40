<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Jonas 40 – havefest</title>
  <!-- Forhåndsvisning når linket deles på Messenger/SMS. og:image skal være en fuld URL. -->
  <meta property="og:title" content="Jonas fylder 40 – havefest 12. juni 2027">
  <meta property="og:description" content="Hjemmebrygget øl, helstegt pattegris, drinks og hygge.">
  <meta property="og:image" content="https://montislignum.github.io/fest-40/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="da_DK">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <svg class="garland" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 4 Q100 36 200 4 Q300 36 400 4" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <g class="bulbs"></g>
    </svg>
    <p class="kicker">Havefest · lørdag 12. juni 2027</p>
    <h1><span id="navn">Jonas</span> fylder <span class="big" id="alder">40</span></h1>
    <a class="btn" href="#svar" id="cta" hidden>Svar</a>
  </header>

  <main>
    <section id="program">
      <h2>Program</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="sted" hidden>
      <h2>Sted</h2>
      <p id="adresse"></p>
      <p id="stedinfo" class="muted"></p>
    </section>

    <section id="praktisk">
      <h2>Praktisk</h2>
      <dl class="facts" id="facts"></dl>
    </section>

    <section id="svar" hidden>
      <h2 id="spoerg">Kommer du?</h2>
      <div id="fejl" class="notice err" hidden></div>

      <form id="rsvp" hidden novalidate>
        <div class="choice" role="radiogroup">
          <label><input type="radio" name="kommer" value="ja"> <span>Ja</span></label>
          <label><input type="radio" name="kommer" value="nej"> <span>Nej</span></label>
        </div>

        <div class="if-yes">
          <label class="field" id="antal-felt">Antal
            <select name="antal" id="antal"></select>
          </label>
          <div id="toast-felt">
            <label class="field switch"><span>Tale eller indslag</span><input type="checkbox" name="indslag" role="switch"></label>
            <input class="field indslag-tekst" name="indslagTekst" maxlength="200" id="indslag-tekst">
          </div>
        </div>

        <button class="btn" type="submit">Send</button>
        <p class="muted small" id="frist"></p>
      </form>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
